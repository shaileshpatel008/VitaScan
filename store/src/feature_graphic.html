<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;font-weight:600;src:url(../../assets/google_fonts/Fraunces-SemiBold.ttf)}
@font-face{font-family:"DM Sans";font-weight:400;src:url(../../assets/google_fonts/DMSans-Regular.ttf)}
@font-face{font-family:"DM Sans";font-weight:600;src:url(../../assets/google_fonts/DMSans-SemiBold.ttf)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
.bg{position:relative;width:1024px;height:500px;background:linear-gradient(135deg,#16897D 0%,#0E6B63 45%,#0A4F49 100%);color:#fff;font-family:"DM Sans";display:flex;align-items:center}
.glow{position:absolute;left:-60px;top:-40px;width:620px;height:620px;background:radial-gradient(circle,rgba(159,240,227,.35),rgba(111,211,196,0) 65%)}
.logo{position:relative;width:360px;height:360px;margin-left:50px;flex-shrink:0}
.text{position:relative;margin-left:24px}
h1{font-family:Fraunces;font-weight:600;font-size:92px;margin:0;line-height:1}
.tag{font-size:30px;opacity:.92;margin-top:14px}
.chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;max-width:520px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 16px;font-size:20px;font-weight:600}
</style></head>
<body><div class="bg"><div class="glow"></div>
<img class="logo" src="../../assets/branding/splash_logo.png" alt="">
<div class="text"><h1>Wellumi</h1><div class="tag">Your well-being, brought to light</div>
<div class="chips"><span class="chip">Heart rate</span><span class="chip">HRV &amp; stress</span><span class="chip">Breathing</span></div></div>
</div></body></html>
